<h2 class="titulo-da-pagina">Produtos cadastrados</h2>

<a mat-raised-button color="primary" routerLink="/produtos/novo">+ Novo Produto</a>

<div *ngIf="estaCarregandoOsProdutos" style="margin-top: 16px;">
  <mat-spinner diameter="32"></mat-spinner>
</div>

<table mat-table [dataSource]="listaDeProdutos" *ngIf="!estaCarregandoOsProdutos" style="width:100%; margin-top: 16px;">

  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef>Codigo</th>
    <td mat-cell *matCellDef="let produto">{{ produto.codigo }}</td>
  </ng-container>

  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef>Descricao</th>
    <td mat-cell *matCellDef="let produto">{{ produto.descricao }}</td>
  </ng-container>

  <ng-container matColumnDef="saldoAtual">
    <th mat-header-cell *matHeaderCellDef>Saldo</th>
    <td mat-cell *matCellDef="let produto">{{ produto.saldoAtual }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['codigo', 'descricao', 'saldoAtual']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['codigo', 'descricao', 'saldoAtual'];"></tr>
</table>

<p *ngIf="!estaCarregandoOsProdutos && listaDeProdutos.length === 0">Nenhum produto cadastrado ainda.</p>
